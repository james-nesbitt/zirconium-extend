# cato-clientd with --use-systemd-resolv 1 reads, backs up and rewrites
# /etc/systemd/resolved.conf. Fedora ships only /usr/lib/systemd/resolved.conf
# and ostree materialises no /etc copy, so the client aborts an already-
# established tunnel:
#   [E] backup_dns_config:303          Failed to read /etc/systemd/resolved.conf
#   [E] cato_setup_dns_config:811      error backing up dns servers
#   [E] utAuthenticatedUpdateNetworkParamet:636  Failed to DNS -> STOP, ERR_USER_INTERRUPTED
# The factory copy is the stock file (entirely commented defaults), so this
# changes no resolver behaviour; it only gives the client a file to edit.
C /etc/systemd/resolved.conf 0644 root root -
