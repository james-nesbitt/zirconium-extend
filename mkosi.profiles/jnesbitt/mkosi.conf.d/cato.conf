# Cato Networks SDP client (VPN), installed straight from its public RPM URL —
# mkosi accepts URLs in Packages=, the same way upstream pulls xwayland-satellite
# from kojipkgs.
#
# Verified /usr-only payload (rpm -ql cato_client-5.8.1-7658): /usr/lib/cato,
# /usr/bin/cato-sdp, /usr/sbin/{cato-clientd,cato-demd}, /etc/ld.so.conf.d and a
# CA anchor — nothing in /opt, so no relocation is needed on an ostree root where
# /opt is a symlink into the (image-discarded) /var. The daemon creates
# /opt/cato -> /var/opt/cato itself at first run.
#
# The URL is a rolling "latest": `cato-sdp update` cannot work on an immutable
# /usr, so version bumps come from rebuilding this image.
[Content]
Packages=
    https://clientdownload.catonetworks.com/public/clients/cato-client-install.rpm
