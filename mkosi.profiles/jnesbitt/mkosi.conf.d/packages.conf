# qt6-qtwebengine (277 MB) is installed with zero dependents, pulled in as a weak
# dependency by upstream's `base` profile setting WithRecommends=true.
#
# Overriding WithRecommends=false here does work — profiles are parsed after
# mkosi.conf.d/ and later assignments win — but it breaks the build: upstream's
# bootc-ostree profile adds the `tpm2-tss` dracut module, whose check() is
# `require_binaries tpm2`, and /usr/bin/tpm2 (tpm2-tools) is itself only a weak
# dependency. dracut then hard-fails in upstream's postinst with
# "Module 'tpm2-tss' cannot be installed." Disabling weak dependencies image-wide
# to drop one measured orphan changes resolution for ~1900 packages; removing the
# orphan by name does not.
#
# Packages=
#   zsh                 login shell; upstream ships none and deletes /usr/bin/chsh
#   @virtualization     virt-manager / virt-install / virsh / libvirt / qemu
#   ffmpegthumbnailer   video thumbnails for dfiles (the one helper the base lacks)
#
# RemovePackages=, grouped by reason:
#   fcitx5-chinese-addons, fcitx5-mozc, fcitx5-rime, librime-lua
#       fcitx5 itself is KEPT — ~/.config/fcitx5/profile drives us/lv layout
#       switching. No CJK engine is used; libime and librime fall out as orphans.
#   ibus
#       second input-method framework; only its own subpackages require it.
#   glibc-all-langpacks
#       LANG=en_US.UTF-8; base already installs glibc-minimal-langpack.
#   dymo-cups-drivers, gutenprint-cups, hplip, printer-driver-brlaser,
#   ptouch-driver, system-config-printer-*
#       no printers configured (/etc/cups/printers.conf has no Printer stanzas).
#   hyperv-daemons, open-vm-tools*, virtualbox-guest-additions, WALinuxAgent-udev
#       guest agents for hypervisors this physical laptop does not run under.
#   cardwire*, cava, hyfetch, input-remapper, khal, orca, tesseract, uxplay
#       no state, no launches, no config anywhere in $HOME.
#   tailscale
#       /var/lib/tailscale untouched since install, never enabled; Cato SDP is
#       the VPN in use.
#   pam-u2f, pamu2fcfg, pam_yubico
#       no ~/.config/Yubico; ykman is not even installed.
[Content]

Packages=
    zsh
    @virtualization
    ffmpegthumbnailer

RemovePackages=
    qt6-qtwebengine
    fcitx5-chinese-addons
    fcitx5-mozc
    fcitx5-rime
    librime-lua
    ibus
    glibc-all-langpacks
    dymo-cups-drivers
    gutenprint-cups
    hplip
    printer-driver-brlaser
    ptouch-driver
    system-config-printer-libs
    system-config-printer-udev
    hyperv-daemons
    open-vm-tools
    open-vm-tools-desktop
    virtualbox-guest-additions
    WALinuxAgent-udev
    cardwire
    cardwire-gui
    cava
    hyfetch
    input-remapper
    khal
    orca
    tesseract
    uxplay
    tailscale
    pam-u2f
    pamu2fcfg
    pam_yubico
