# Dux Files (dfiles), the standalone file manager released alongside DMS 2.0.
# Upstream installs it on rawhide only (mkosi.profiles/base-desktop/.../dms-rawhide.conf),
# so it has to be named here for the stable release. The COPR also carries
# quickshell; only dux-files is requested so the base image's quickshell keeps
# satisfying DMS's dependency.
[Distribution]
Repositories=copr:copr.fedorainfracloud.org:duxlabs:dux-repo

[Content]
Packages=
    dux-files
