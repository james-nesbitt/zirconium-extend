# ghostty is the default terminal (/etc/xdg/xdg-terminals.list), mise provides
# the user toolchain on the host as well as inside distrobox — until now mise
# existed only in the container, so host shells silently lost 33 tools.
# chezmoi and just are already in upstream's root package list; do not duplicate.
[Distribution]
Repositories=terra

[Content]
Packages=
    ghostty
    mise
