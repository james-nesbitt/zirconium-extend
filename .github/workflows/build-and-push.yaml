name: Build and Push OCI Image

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute image tags and labels
        id: meta
        shell: bash
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          TAGS=""
          case "${{ github.event_name }}" in
            schedule|workflow_dispatch)
              TAGS="${IMAGE}:nightly"
              ;;
            push)
              BRANCH="${{ github.ref_name }}"
              SHA="${{ github.sha }}"
              TAGS="${IMAGE}:${BRANCH} ${IMAGE}:sha-${SHA}"
              if [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
                TAGS="${TAGS} ${IMAGE}:latest"
              fi
              ;;
            pull_request)
              PR="${{ github.event.pull_request.number }}"
              BRANCH="${{ github.head_ref }}"
              SHA="${{ github.event.pull_request.head.sha }}"
              TAGS="${IMAGE}:pr-${PR} ${IMAGE}:${BRANCH} ${IMAGE}:sha-${SHA}"
              ;;
          esac
          # newline-separated for buildah-build, space-separated for display
          printf 'tags<<EOF\n%s\nEOF\n' "$(echo $TAGS | tr ' ' '\n')" >> "$GITHUB_OUTPUT"
          # OCI standard labels
          printf 'labels<<EOF\n%s\nEOF\n' "\
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build OCI image
        id: build
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          containerfiles: ./Containerfile
          oci: true

      - name: Push OCI image
        uses: redhat-actions/push-to-registry@v2
        with:
          tags: ${{ steps.build.outputs.tags }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  cleanup-old-tags:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request'
    permissions:
      packages: write

    steps:
      - name: Delete old SHA tags
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          token: ${{ secrets.GITHUB_TOKEN }}
          delete-only-untagged-versions: false
          min-versions-to-keep: 5
          ignore-versions: '^(latest|nightly|master|pr-\d+)$'
